
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI — Intelligent Assistant</title>
<style>
:root {
  --bg:#ffffff; --panel:#f7f7f8; --text:#202123;
  --muted:#777982; --border:#e5e5e5; --accent:#10a37f;
  --hover:#ececec; --user:#f4f4f4;
}
body.dark {
  --bg:#212121; --panel:#171717; --text:#ececec;
  --muted:#a5a5a5; --border:#383838; --hover:#303030;
  --user:#303030;
}
* { box-sizing:border-box; }
body {
  margin:0; height:100vh; overflow:hidden;
  display:flex; background:var(--bg); color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea { font:inherit; }
button { cursor:pointer; }
.sidebar {
  width:260px; background:var(--panel); padding:14px;
  display:flex; flex-direction:column; gap:12px;
  border-right:1px solid var(--border); flex-shrink:0;
}
.brand { display:flex; align-items:center; gap:10px; padding:8px 5px 14px; font-size:20px; font-weight:700; }
.logo {
  background:var(--accent); color:white; width:35px; height:35px;
  border-radius:12px; display:grid; place-items:center; font-size:20px;
}
.btn {
  border:1px solid var(--border); background:transparent;
  color:var(--text); border-radius:10px; padding:11px;
  text-align:left; display:flex; align-items:center; gap:10px;
}
.btn:hover,.history-item:hover { background:var(--hover); }
.new-chat { justify-content:center; font-weight:600; }
.section-label { color:var(--muted); font-size:12px; padding:12px 7px 2px; }
.history { overflow:auto; flex:1; }
.history-item {
  padding:11px; border-radius:9px; cursor:pointer;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:14px;
}
.history-item.active { background:var(--hover); }
.sidebar-bottom { display:grid; gap:7px; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  height:60px; padding:0 22px; display:flex; align-items:center;
  justify-content:space-between; border-bottom:1px solid var(--border);
}
.top-title { font-weight:600; }
.top-actions { display:flex; gap:8px; }
.icon-btn {
  width:38px; height:38px; border:1px solid var(--border);
  border-radius:11px; background:transparent; color:var(--text);
  display:grid; place-items:center; font-size:18px;
}
.icon-btn:hover { background:var(--hover); }
.messages {
  flex:1; overflow-y:auto; padding:26px 18px 35px;
  scroll-behavior:smooth;
}
.welcome { max-width:760px; margin:12vh auto 0; text-align:center; }
.welcome h1 { font-size:34px; margin-bottom:12px; letter-spacing:-1px; }
.welcome p { color:var(--muted); line-height:1.6; }
.suggestions {
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin-top:30px; text-align:left;
}
.suggestion {
  border:1px solid var(--border); border-radius:14px;
  padding:15px; background:var(--bg); color:var(--text);
}
.suggestion:hover { background:var(--panel); }
.suggestion strong { display:block; margin-bottom:6px; }
.suggestion span { color:var(--muted); font-size:13px; }
.message { max-width:800px; margin:0 auto 24px; }
.message-row { display:flex; gap:13px; align-items:flex-start; }
.avatar {
  width:31px; height:31px; border-radius:50%; flex-shrink:0;
  display:grid; place-items:center; background:var(--panel); font-size:15px;
}
.message.user .avatar { background:var(--accent); color:white; }
.content { min-width:0; flex:1; line-height:1.7; white-space:pre-wrap; overflow-wrap:anywhere; }
.content img { max-width:min(100%,360px); max-height:300px; object-fit:contain; display:block; margin-top:10px; border-radius:12px; }
.message-tools { display:flex; gap:6px; margin:9px 0 0 44px; }
.message-tools button {
  border:0; background:transparent; color:var(--muted);
  padding:5px 8px; border-radius:7px; font-size:12px;
}
.message-tools button:hover { background:var(--hover); }
.composer-area { padding:12px 18px 8px; }
.composer { max-width:800px; margin:auto; }
.attachments { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.attachment {
  position:relative; border:1px solid var(--border);
  border-radius:10px; padding:5px; width:75px; height:75px;
}
.attachment img { width:100%; height:100%; object-fit:cover; border-radius:6px; }
.attachment button {
  position:absolute; right:-6px; top:-7px; border:0; border-radius:50%;
  width:22px; height:22px; background:#444; color:white;
}
.composer-box {
  border:1px solid var(--border); border-radius:22px;
  padding:10px; box-shadow:0 3px 15px #0000000b;
  background:var(--bg);
}
#prompt {
  width:100%; resize:none; border:0; outline:0; color:var(--text);
  background:transparent; min-height:42px; max-height:180px;
  padding:9px 8px; line-height:1.5;
}
.composer-tools { display:flex; align-items:center; gap:7px; }
.tool {
  border:0; background:transparent; color:var(--muted);
  border-radius:10px; padding:9px 11px; font-size:14px;
}
.tool:hover { background:var(--hover); }
.tool.primary { background:var(--text); color:var(--bg); margin-left:auto; }
.tool.primary:disabled { opacity:.4; cursor:default; }
.notice { text-align:center; color:var(--muted); font-size:11px; padding:9px 0 0; }
.status { color:var(--muted); font-size:12px; padding:4px 0 8px; }
@media(max-width:700px) {
  .sidebar { position:fixed; z-index:5; top:0; bottom:0; left:0; width:260px; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 0 100vmax transparent; }
  .sidebar.open { transform:translateX(0); box-shadow:0 0 0 100vmax #0006; }
  .topbar { padding:0 12px; }
  .messages { padding:20px 13px; }
  .welcome { margin-top:8vh; }
  .welcome h1 { font-size:27px; }
  .suggestions { grid-template-columns:1fr; }
  .composer-area { padding:10px; }
}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo">✦</span><span>My AI</span></div>
  <button class="btn new-chat" id="newChat">＋ New chat</button>
  <button class="btn" id="searchChats">⌕ Search chats</button>
  <div class="section-label">YOUR CONVERSATIONS</div>
  <div class="history" id="history"></div>
  <div class="sidebar-bottom">
    <button class="btn" id="themeBtn">◐ Appearance</button>
    <button class="btn" id="clearChats">♲ Clear chat history</button>
    <div class="status" id="status">Ready to chat</div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <span class="top-title">My AI <span style="color:var(--muted);font-weight:400">▾</span></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="exportBtn" title="Export conversation">⇩</button>
      <button class="icon-btn" id="themeTop" title="Toggle appearance">◐</button>
    </div>
  </header>

  <section class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="logo" style="margin:auto;width:55px;height:55px;font-size:28px;border-radius:18px">✦</div>
      <h1>What can I help you with?</h1>
      <p>Your personal AI assistant. Ask a question, explore an idea,<br>or upload an image to include it with your message.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain artificial intelligence in simple words"><strong>✧ Learn something</strong><span>Explain a difficult topic simply</span></button>
        <button class="suggestion" data-prompt="Help me write a professional email"><strong>✎ Write something</strong><span>Draft a clear, professional email</span></button>
        <button class="suggestion" data-prompt="Write a Python program for a beginner"><strong>⌘ Write code</strong><span>Build and understand a program</span></button>
        <button class="suggestion" data-prompt="Give me five creative project ideas"><strong>✦ Brainstorm ideas</strong><span>Discover new possibilities</span></button>
      </div>
    </div>
    <div id="messageList"></div>
  </section>

  <footer class="composer-area">
    <div class="composer">
      <div class="attachments" id="attachments"></div>
      <div class="composer-box">
        <textarea id="prompt" rows="1" placeholder="Message My AI..." aria-label="Message My AI"></textarea>
        <div class="composer-tools">
          <button class="tool" id="uploadBtn" title="Attach image">＋ Attach</button>
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <button class="tool" id="micBtn" title="Voice input">🎙 Voice</button>
          <button class="tool" id="readBtn" title="Toggle read aloud">🔊 Read aloud</button>
          <button class="tool primary" id="sendBtn" title="Send message">↑ Send</button>
        </div>
      </div>
      <div class="notice">My AI can make mistakes. Check important information.</div>
    </div>
  </footer>
</main>

<script>
const $ = id => document.getElementById(id);
const messagesEl = $('messages');
const messageList = $('messageList');
const promptEl = $('prompt');
const historyEl = $('history');
const statusEl = $('status');
let chats = [];
let activeId = null;
let pendingFiles = [];
let busy = false;
let readAloud = false;
let controller = null;

try {
  chats = JSON.parse(localStorage.getItem('myai_chats') || '[]');
  if (!Array.isArray(chats)) chats = [];
} catch { chats = []; }

function saveChats() {
  try { localStorage.setItem('myai_chats', JSON.stringify(chats)); }
  catch { statusEl.textContent = 'Storage is full. Export important chats.'; }
}
function activeChat() { return chats.find(c => c.id === activeId); }
function newChat() {
  activeId = null;
  pendingFiles = [];
  renderAttachments();
  messageList.innerHTML = '';
  $('welcome').style.display = 'block';
  promptEl.value = '';
  renderHistory();
  $('sidebar').classList.remove('open');
  promptEl.focus();
}
function renderHistory() {
  historyEl.innerHTML = '';
  [...chats].reverse().forEach(chat => {
    const item = document.createElement('div');
    item.className = 'history-item' + (chat.id === activeId ? ' active' : '');
    item.textContent = chat.title || 'New chat';
    item.title = item.textContent;
    item.onclick = () => openChat(chat.id);
    historyEl.appendChild(item);
  });
}
function openChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;
  activeId = id;
  messageList.innerHTML = '';
  $('welcome').style.display = 'none';
  chat.messages.forEach(m => renderMessage(m.role, m.text, m.images || [], false));
  renderHistory();
  messagesEl.scrollTop = messagesEl.scrollHeight;
  $('sidebar').classList.remove('open');
}
function renderMessage(role, text, images = [], animate = false) {
  $('welcome').style.display = 'none';
  const wrap = document.createElement('article');
  wrap.className = 'message ' + role;
  const row = document.createElement('div');
  row.className = 'message-row';
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '●' : '✦';
  const content = document.createElement('div');
  content.className = 'content';
  content.textContent = text;
  images.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'Attached image';
    content.appendChild(img);
  });
  row.append(avatar, content);
  wrap.appendChild(row);
  if (role === 'assistant' && text) {
    const tools = document.createElement('div');
    tools.className = 'message-tools';
    const copy = document.createElement('button');
    copy.textContent = '▢ Copy';
    copy.onclick = () => navigator.clipboard.writeText(text).then(() => statusEl.textContent = 'Copied response');
    tools.appendChild(copy);
    if (readAloud) {
      const speak = document.createElement('button');
      speak.textContent = '🔊 Read';
      speak.onclick = () => speakText(text);
      tools.appendChild(speak);
    }
    wrap.appendChild(tools);
  }
  messageList.appendChild(wrap);
  if (animate) messagesEl.scrollTop = messagesEl.scrollHeight;
  return content;
}
function renderAttachments() {
  $('attachments').innerHTML = '';
  pendingFiles.forEach((file, i) => {
    const box = document.createElement('div');
    box.className = 'attachment';
    const img = document.createElement('img');
    img.src = file.data;
    img.alt = file.name;
    const remove = document.createElement('button');
    remove.textContent = '×';
    remove.onclick = () => { pendingFiles.splice(i, 1); renderAttachments(); };
    box.append(img, remove);
    $('attachments').appendChild(box);
  });
}
function persistMessage(role, text, images = []) {
  const chat = activeChat();
  if (!chat) return;
  chat.messages.push({role, text, images});
  saveChats();
}
async function sendMessage(textOverride) {
  if (busy) return;
  const text = (textOverride ?? promptEl.value).trim();
  if (!text && !pendingFiles.length) return;
  const images = pendingFiles.map(f => f.data);
  const userText = text || 'Please look at the attached image.';
  let chat = activeChat();
  if (!chat) {
    chat = {id: String(Date.now()), title: userText.slice(0, 42) || 'Image chat', messages: []};
    chats.push(chat);
    activeId = chat.id;
  } else if (chat.messages.length === 0) {
    chat.title = userText.slice(0, 42);
  }
  promptEl.value = '';
  promptEl.style.height = '42px';
  pendingFiles = [];
  renderAttachments();
  renderMessage('user', userText, images, true);
  persistMessage('user', userText, images);
  renderHistory();
  busy = true;
  $('sendBtn').textContent = '…';
  statusEl.textContent = 'Thinking…';
  controller = new AbortController();
  const waiting = renderMessage('assistant', 'Thinking…', [], true);
  try {
    const response = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:userText}),
      signal:controller.signal
    });
    if (!response.ok) {
      let detail = 'Request failed (' + response.status + ')';
      try { const data = await response.json(); detail = data.detail || detail; } catch {}
      throw new Error(detail);
    }
    const data = await response.json();
    const reply = data.reply || 'I could not generate a response.';
    waiting.textContent = reply;
    const parent = waiting.closest('.message');
    if (parent) {
      const tools = document.createElement('div');
      tools.className = 'message-tools';
      const copy = document.createElement('button');
      copy.textContent = '▢ Copy';
      copy.onclick = () => navigator.clipboard.writeText(reply).then(() => statusEl.textContent = 'Copied response');
      tools.appendChild(copy);
      parent.appendChild(tools);
    }
    persistMessage('assistant', reply);
    if (readAloud) speakText(reply);
    statusEl.textContent = 'Ready to chat';
  } catch (err) {
    waiting.textContent = err.name === 'AbortError' ? 'Generation stopped.' : 'Sorry, an error occurred: ' + err.message;
    statusEl.textContent = 'Could not complete request';
  } finally {
    busy = false;
    controller = null;
    $('sendBtn').textContent = '↑ Send';
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}
function speakText(text) {
  if (!('speechSynthesis' in window)) {
    statusEl.textContent = 'Speech playback is not supported in this browser.';
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(utterance);
}
$('newChat').onclick = newChat;
$('sendBtn').onclick = () => sendMessage();
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
promptEl.addEventListener('input', () => {
  promptEl.style.height = '42px';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + 'px';
});
document.querySelectorAll('.suggestion').forEach(btn => {
  btn.onclick = () => { promptEl.value = btn.dataset.prompt; promptEl.focus(); };
});
$('uploadBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  for (const file of [...e.target.files]) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 5 * 1024 * 1024) {
      statusEl.textContent = 'Each image must be smaller than 5 MB.';
      continue;
    }
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    pendingFiles.push({name:file.name, data});
  }
  renderAttachments();
  e.target.value = '';
};
$('micBtn').onclick = () => {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    statusEl.textContent = 'Speech recognition is unavailable. Try Chrome or Edge.';
    return;
  }
  const recognition = new Recognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.onstart = () => statusEl.textContent = 'Listening…';
  recognition.onresult = e => {
    promptEl.value += (promptEl.value ? ' ' : '') + e.results[0][0].transcript;
    promptEl.dispatchEvent(new Event('input'));
    statusEl.textContent = 'Speech added to message';
  };
  recognition.onerror = () => statusEl.textContent = 'Microphone unavailable or permission denied.';
  recognition.onend = () => { if (!busy) statusEl.textContent = 'Ready to chat'; };
  recognition.start();
};
$('readBtn').onclick = () => {
  readAloud = !readAloud;
  $('readBtn').textContent = readAloud ? '🔊 Read aloud: On' : '🔊 Read aloud';
  statusEl.textContent = readAloud ? 'Read aloud enabled' : 'Read aloud disabled';
};
function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem('myai_dark', document.body.classList.contains('dark') ? '1' : '0');
}
$('themeBtn').onclick = toggleTheme;
$('themeTop').onclick = toggleTheme;
if (localStorage.getItem('myai_dark') === '1') document.body.classList.add('dark');
$('menuBtn').onclick = () => $('sidebar').classList.toggle('open');
$('clearChats').onclick = () => {
  if (confirm('Delete all saved conversations from this browser?')) {
    chats = [];
    saveChats();
    newChat();
  }
};
$('searchChats').onclick = () => {
  const q = prompt('Search your conversation titles:');
  if (q === null) return;
  [...historyEl.children].forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
};
$('exportBtn').onclick = () => {
  const chat = activeChat();
  if (!chat) { statusEl.textContent = 'Open a conversation to export it.'; return; }
  const blob = new Blob([JSON.stringify(chat, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-ai-chat.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
renderHistory();
if (chats.length) openChat(chats[chats.length - 1].id);
</script>
</body>
</html>
